name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  test:
    name: test (${{ matrix.os }}, node ${{ matrix.node }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - { os: windows-latest, node: 24 }
          - { os: windows-latest, node: 22 }
          - { os: ubuntu-latest, node: 24 }
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
      - name: Deploy script (Windows default target)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          npm run deploy
          if (-not (Test-Path "$env:USERPROFILE\grokbot-mcp\grokbot-mcp.mjs")) { throw "deploy did not write the server" }

  bundle:
    name: MCP Bundle
    runs-on: ubuntu-latest
    needs: test
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - run: npm run bundle
      - uses: actions/upload-artifact@v7
        with:
          name: grokbot-mcp-mcpb
          path: dist/*.mcpb
          if-no-files-found: error
