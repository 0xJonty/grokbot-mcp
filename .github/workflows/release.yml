name: Release

# Push a tag like v0.2.0 (matching package.json) to publish a GitHub Release with the
# one-click .mcpb bundle and the plain single-file server attached.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: npm
      - run: npm ci
      - name: Tag matches package.json
        run: |
          v=$(node -p "require('./package.json').version")
          [ "v$v" = "$GITHUB_REF_NAME" ] || { echo "tag $GITHUB_REF_NAME != package.json v$v"; exit 1; }
      - run: npm run typecheck
      - run: npm test
      - run: npm run bundle
      - name: Release notes from CHANGELOG.md
        run: |
          node -e '
            const v = process.env.GITHUB_REF_NAME.slice(1);
            const s = require("fs").readFileSync("CHANGELOG.md", "utf8");
            const m = s.match(new RegExp("^## \\[" + v.replace(/\./g, "\\.") + "\\][^\\n]*\\n([\\s\\S]*?)(?=^## \\[|(?![\\s\\S]))", "m"));
            if (!m) { console.error("No CHANGELOG.md section for " + v); process.exit(1); }
            require("fs").writeFileSync("notes.md", m[1].trim() + "\n");
          '
      - name: Publish release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "dist/grokbot-mcp-${GITHUB_REF_NAME#v}.mcpb" \
            dist/grokbot-mcp.mjs \
            --title "$GITHUB_REF_NAME" --notes-file notes.md
